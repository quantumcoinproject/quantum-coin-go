name: Windows Release

on:
  push:
    tags:
    - '*'    

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: true

      matrix:
        os: [windows-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
       go-version: '1.25.3'
          
    - name: Build
      run: |
         mkdir ${{ github.workspace }}\build && go build -o ${{ github.workspace }}\build ./...

    - name: Create Release
      
      run: |
         echo ${{  github.ref_name }}
         powershell Compress-Archive ${{ github.workspace }}\build ${{ github.workspace }}\build\quantumcoin-windows-${{  github.ref_name }}.zip
         powershell Get-FileHash ${{ github.workspace }}\build\quantumcoin-windows-${{  github.ref_name }}.zip > ${{ github.workspace }}\build\releasehash-quantumcoin-windows-${{  github.ref_name }}.txt
        
         mkdir ${{ github.workspace }}\build\dp
         copy ${{ github.workspace }}\build\dp.exe ${{ github.workspace }}\build\dp\dp.exe
         copy ${{ github.workspace }}\build\dputil.exe ${{ github.workspace }}\build\dp\dputil.exe
         copy ${{ github.workspace }}\build\relay.exe ${{ github.workspace }}\build\dp\relay.exe
         copy ${{ github.workspace }}\cmd\relay\config.json ${{ github.workspace }}\build\dp\config.json
         copy ${{ github.workspace }}\consensus\proofofstake\genesis\genesis.json ${{ github.workspace }}\build\dp\genesis.json
         copy ${{ github.workspace }}\resources\*.* ${{ github.workspace }}\build\dp\
         del ${{ github.workspace }}\build\dp\connect.sh
         del ${{ github.workspace }}\build\dp\connectvalidator.sh
         powershell Compress-Archive ${{ github.workspace }}\build\dp ${{ github.workspace }}\build\qc-release-windows-${{  github.ref_name }}.zip
         powershell Get-FileHash ${{ github.workspace }}\build\qc-release-windows-${{  github.ref_name }}.zip > ${{ github.workspace }}\build\releasehash-windows-${{  github.ref_name }}.txt
         del ${{ github.workspace }}\build\dp\connect.cmd
         del ${{ github.workspace }}\build\dp\connectvalidator.cmd        
         copy ${{ github.workspace }}\resources\compact\*.cmd ${{ github.workspace }}\build\dp\
         powershell Compress-Archive ${{ github.workspace }}\build\dp ${{ github.workspace }}\build\qc-release-windows-compact-${{  github.ref_name }}.zip
         powershell Get-FileHash ${{ github.workspace }}\build\qc-release-windows-compact-${{  github.ref_name }}.zip > ${{ github.workspace }}\build\releasehash-windows-compact-${{  github.ref_name }}.txt        
         
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: qc-release-windows
        path: |
              ${{ github.workspace }}/build/*.*
              
    - name: release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "build/*.zip,build/*.txt"
