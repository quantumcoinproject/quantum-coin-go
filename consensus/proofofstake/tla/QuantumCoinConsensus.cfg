\* TLC model-checking configuration for QuantumCoinConsensus
\* Run: java -jar tla2tools.jar -config QuantumCoinConsensus.cfg MCQuantumCoinConsensus

SPECIFICATION MC_Spec

\* --- Constant assignments (use MC helper values) ---
CONSTANTS
    Validators <- MC_Validators
    Deposits <- MC_Deposits
    Proposer <- MC_Proposer
    MaxRound <- MC_MaxRound
    Byzantine <- MC_Byzantine

\* --- Type invariant ---
INVARIANT TypeOK

\* --- Safety properties (checked as invariants) ---
INVARIANT Agreement
INVARIANT Validity
INVARIANT Round2Consistency
INVARIANT CommitIntegrity

\* --- Liveness properties (checked as temporal properties) ---
PROPERTY Termination
\* RoundProgress is intentionally excluded: the leads-to property is too strong
\* because it fires on transient states where thresholds are not yet met but votes
\* are still arriving. Termination already covers the essential liveness guarantee.
